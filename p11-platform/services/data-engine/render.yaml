services:
  # Main FastAPI Web Service
  - type: web
    name: oneClick
    runtime: python
    rootDir: p11-platform/services/data-engine
    autoDeployTrigger: "off"
    region: virginia
    plan: standard
    # playwright install is required for browser-based scraping (bot-protected sites)
    buildCommand: pip install --require-hashes -r requirements.txt && playwright install chromium
    # Keep a single application worker and reserve memory for Chromium.
    startCommand: gunicorn main:app --workers 1 --timeout 1800 --graceful-timeout 60 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    
    envVars:
      # Bundle Chromium with the installed package so it survives deployment.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      
      # Google Calendar OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      
      # OpenAI & Anthropic
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      
      # Google Cloud (for Vertex AI)
      - key: GOOGLE_CLOUD_PROJECT_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      
      # Data Engine API Key
      - key: DATA_ENGINE_API_KEY
        sync: false
      - key: SITEFORGE_MIGRATION_MANIFEST_SECRET
        sync: false
      
      # CRM Integrations (optional)
      - key: SALESFORCE_CLIENT_ID
        sync: false
      - key: SALESFORCE_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_API_KEY
        sync: false
    
    # Calendar health is not a nested web-service job. The old declaration never
    # established a Render cron. Any replacement needs its own reviewed service
    # and current credential-claim path before activation. See PHASE_6_OPERATIONS.

  # CB06: independent parser queue; no project-wide service key or model key.
  # Enable the custom access-token hook and assign this dedicated identity only
  # to qualified communities before creating this worker. Auto deploy is off.
  - type: worker
    name: p11-community-brain-worker
    runtime: docker
    region: virginia
    plan: 1c-2g
    rootDir: p11-platform/services/data-engine
    dockerfilePath: ./Dockerfile.community-brain
    dockerContext: .
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 300
    numInstances: 1
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: COMMUNITY_BRAIN_WORKER_EMAIL
        sync: false
      - key: COMMUNITY_BRAIN_WORKER_PASSWORD
        sync: false
      - key: BRAIN_PARSER_SANDBOX_REQUIRED
        value: "true"
