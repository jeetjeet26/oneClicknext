name: SiteForge Vertical V2

on:
  pull_request:
    paths:
      - "p11-platform/apps/web/**"
      - "p11-platform/supabase/**"
      - "p11-platform/scripts/platform/**"
      - "wordpress-theme/oneclick-siteforge/**"
      - ".github/workflows/siteforge-vertical-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: p11-platform/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: p11-platform/apps/web/package-lock.json
      - run: npm install --global npm@11.12.1
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.16
      - name: Verify offline platform qualification tools
        working-directory: p11-platform
        run: python3 -m unittest discover -s scripts/platform -v
      - name: Reconstructed development schema regression (not a production upgrade)
        working-directory: p11-platform
        run: |
          npm run supabase:start
          npm run supabase:reset
          npm run test:db:vertical
      - run: npm run siteforge:verticals:qualify
      - run: npm run check:schema-types-sync
      - run: npm run check:schema-truth
      - run: npm run check:foundation
      - run: npm run siteforge:artifacts:drift-check
        env:
          SITEFORGE_THEME_SIGNING_KEY: ${{ secrets.SITEFORGE_THEME_SIGNING_KEY }}
          # ZIP timestamps use local calendar fields; match the retained packages.
          TZ: America/Los_Angeles
      - run: npm run build
        env:
          # Route modules construct SDK clients during page-data collection.
          # Compilation must not require or use a production provider credential.
          OPENAI_API_KEY: ci-build-only-not-a-valid-provider-key
      - name: Validate Vertical V2 PHP blocks
        working-directory: .
        run: |
          php -l wordpress-theme/oneclick-siteforge/functions.php
          php -l wordpress-theme/oneclick-siteforge/inc/rest-api.php
          php -l wordpress-theme/oneclick-siteforge/inc/block-utilities.php
          for file in wordpress-theme/oneclick-siteforge/blocks/*.php; do php -l "$file"; done
