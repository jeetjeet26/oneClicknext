services:
  # Main FastAPI Web Service
  - type: web
    name: p11-data-engine
    runtime: python
    region: oregon
    plan: starter
    # playwright install is required for browser-based scraping (bot-protected sites)
    buildCommand: pip install --require-hashes -r requirements.txt && playwright install chromium
    # 1 worker: the 512MB starter instance OOMs with 2 workers once Chromium launches
    startCommand: gunicorn main:app --workers 1 --timeout 1800 --graceful-timeout 60 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    
    envVars:
      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      
      # Google Calendar OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      
      # OpenAI & Anthropic
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      
      # Google Cloud (for Vertex AI)
      - key: GOOGLE_CLOUD_PROJECT_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      
      # Data Engine API Key
      - key: DATA_ENGINE_API_KEY
        sync: false
      - key: SITEFORGE_MIGRATION_MANIFEST_SECRET
        sync: false
      
      # CRM Integrations (optional)
      - key: SALESFORCE_CLIENT_ID
        sync: false
      - key: SALESFORCE_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_API_KEY
        sync: false
    
    # Calendar health is not a nested web-service job. The old declaration never
    # established a Render cron. Any replacement needs its own reviewed service
    # and current credential-claim path before activation. See PHASE_6_OPERATIONS.
